services:
  # 1. Database
  postgres:
    image: postgres:15-alpine
    container_name: namecard_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: namecard_platform
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  # 2. Redis (Queue & Cache)
  redis:
    image: redis:alpine
    container_name: namecard_redis
    restart: always
    networks:
      - app_network

  api:
    container_name: namecard_api
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      POSTGRES_HOST: namecard_db
      POSTGRES_PORT: 5432
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: namecard_platform
      DATABASE_URL: postgres://admin:secure_password@namecard_db:5432/namecard_platform
      REDIS_HOST: namecard_redis
      REDIS_PORT: 6379
      JWT_SECRET: super_secret_jwt_key
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-false}
      ConfigModule_isGlobal: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      FrontendUrl: https://nexsolution.cloud
      PORT: 4000
      # SMTP Configuration for Password Reset Emails
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-dpattown.ai@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-qmmfnljjtukzigrj}
      SMTP_FROM: ${SMTP_FROM:-noreply@nexsolution.cloud}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      UPGRADE_PLAN_NOTIFY_EMAILS: ${UPGRADE_PLAN_NOTIFY_EMAILS:-}
      FRONTEND_URL: https://nexsolution.cloud
      CORS_ALLOWED_ORIGINS: https://nexsolution.cloud,https://www.nexsolution.cloud,http://localhost:3000,http://localhost:3001
      API_URL: https://nexsolution.cloud/api
      # OAuth Configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_MESSAGING_API_CHANNEL_ACCESS_TOKEN: ${LINE_MESSAGING_API_CHANNEL_ACCESS_TOKEN:-}
      LINE_UPGRADE_NOTIFY_TO: ${LINE_UPGRADE_NOTIFY_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GCLOUD_PROJECT: ${GCLOUD_PROJECT:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      NEX_VERTEX_PROXY_SECRET: ${NEX_VERTEX_PROXY_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres # Changed from 'db' to 'postgres' to match existing service name
      - redis
    volumes:
      - ./uploads:/app/uploads  # Persist uploaded files
    ports:
      - "127.0.0.1:4001:4000"
    networks:
      - default
      - n8n_default
      - app_network # Added to allow communication with postgres and redis
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.nex-api.rule=Host(`nexsolution.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.nex-api.entrypoints=websecure"
      - "traefik.http.routers.nex-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.nex-api.loadbalancer.server.port=4000"
      - "traefik.http.routers.nex-api.priority=100"
      # Increase max body size for video uploads (250MB)
      - "traefik.http.middlewares.nex-api-buffering.buffering.maxRequestBodyBytes=250000000"
      - "traefik.http.routers.nex-api.middlewares=nex-api-buffering"
      # Disable response buffering for streaming uploads
      - "traefik.http.services.nex-api.loadbalancer.responseforwarding.flushinterval=100ms"

  web:
    container_name: namecard_web
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_THEME_VARIANT: ${NEXT_PUBLIC_THEME_VARIANT:-default}
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_THEME_VARIANT: ${NEXT_PUBLIC_THEME_VARIANT:-default}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.nex-web.rule=Host(`nexsolution.cloud`)"
      - "traefik.http.routers.nex-web.entrypoints=websecure"
      - "traefik.http.routers.nex-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.nex-web.loadbalancer.server.port=3000"


networks:
  default:
  n8n_default:
    external: true
  app_network:
    driver: bridge
